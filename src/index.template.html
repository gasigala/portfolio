<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{URL}}/">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23ff4a17'/%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js')</script>
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#index">skip to index</a>

<main id="viewport" aria-label="Project grid">
  <div id="track">
    <div class="lattice" aria-hidden="true"></div>
  </div>
</main>

<header class="hud hud--top">
  <p class="hud__brand">{{OWNER}}<span>portfolio</span></p>
  <p class="hud__clock" id="clock" aria-hidden="true"></p>
  <p class="hud__nav">
    <button class="hud__button" id="index-toggle" type="button" aria-expanded="false" aria-controls="index">
      index
    </button>
    <span class="hud__count" id="counter">01/10</span>
  </p>
</header>

<footer class="hud hud--bottom">
  <p class="hud__pos" id="readout"></p>
  <p class="hud__hint">arrows / wasd / swipe &nbsp;·&nbsp; enter to open</p>
</footer>

<nav id="index" class="index" aria-label="Index of spaces">
  <ol class="index__list">
{{NOSCRIPT}}
  </ol>
</nav>

<p id="live" class="sr-only" role="status" aria-live="polite"></p>
<script type="application/json" id="data">{{DATA}}</script>
</body>
</html>
